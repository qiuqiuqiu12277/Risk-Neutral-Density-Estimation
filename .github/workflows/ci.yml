name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=rnd_estimator --cov-report=term-missing
      - run: rnd-estimate simulate --runs 3 --seed 42 --no-plot
      - run: >-
          rnd-estimate compare
          --input data/sample_option_chain.csv
          --spot 100
          --maturity 0.25
          --rate 0.03
          --dividend-yield 0.01
          --annual-volatility 0.22
          --component-candidates 5 7
          --folds 3
          --no-plot
